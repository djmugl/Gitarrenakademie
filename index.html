<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08131d"><title>Gitarrenakademie | Roland</title><style>
:root{color-scheme:dark;--bg:#08131d;--panel:#112330;--panel2:#193240;--accent:#35e4d0;--text:#f2f7fa;--muted:#a8beca}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,sans-serif}button,input,select{font:inherit}button{cursor:pointer}a{color:var(--accent)}header{padding:22px max(20px,env(safe-area-inset-left));background:linear-gradient(130deg,#173747,#0b1924);border-bottom:1px solid #294250}.wrap{max-width:1160px;margin:auto;padding:22px}h1{font-size:clamp(27px,4vw,40px);margin:0}h2{margin:0 0 14px}h3{margin:0 0 8px}.muted{color:var(--muted)}.eyebrow{color:var(--accent);font-weight:700;letter-spacing:.09em;text-transform:uppercase;font-size:12px}.nav{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}.nav button,.btn{border:1px solid #31515c;background:#17323e;color:white;border-radius:12px;padding:11px 15px}.nav button.active,.btn.primary{background:var(--accent);color:#06202a;font-weight:800;border-color:var(--accent)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px}.card{background:var(--panel);border:1px solid #2a4350;border-radius:18px;padding:19px}.card p{margin:7px 0}.card.click{cursor:pointer}.card.click:hover{border-color:var(--accent)}.pill{display:inline-block;background:#1c3b43;color:var(--accent);padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700}.bar{height:11px;background:#2a414c;border-radius:20px;overflow:hidden}.bar span{display:block;height:100%;background:var(--accent)}.lesson{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #2a4350;padding:13px 0}.lesson:last-child{border:0}.lesson button{min-width:100px}.hidden{display:none!important}.diagram{display:flex;flex-direction:column;align-items:center;gap:7px}.fret{display:grid;grid-template-columns:repeat(6,38px);grid-template-rows:repeat(5,42px);position:relative;background:repeating-linear-gradient(to bottom,transparent 0 40px,#8eabb7 40px 42px);border-top:5px solid #e2f3fa;border-left:2px solid #7a9da9;border-right:2px solid #7a9da9;width:228px}.fret:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(to right,transparent 0 36px,#9fb6bd 36px 38px);pointer-events:none}.dot{z-index:1;display:grid;place-items:center;justify-self:center;align-self:center;width:29px;height:29px;border-radius:50%;background:var(--accent);color:#06202a;font-weight:900}.strings{display:grid;grid-template-columns:repeat(6,38px);width:228px;text-align:center;font-size:13px}.strings.top{font-weight:700}.strings .off{color:#fb8c8c}.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}.video{display:inline-flex;align-items:center;gap:8px;text-decoration:none;border:1px solid #3b6668;padding:11px 13px;border-radius:11px;margin-top:12px}.big{font-size:25px;font-weight:800;color:var(--accent)}.exercise{border-left:4px solid var(--accent);padding:12px 16px;background:#17323b;border-radius:7px}.note{font-size:13px;color:var(--muted)}.row{display:flex;flex-wrap:wrap;gap:9px;align-items:center}.row input[type=number]{width:90px;background:#193440;color:white;border:1px solid #4d6c76;border-radius:9px;padding:9px}.chordpick{min-width:60px}.chordpick.active{background:var(--accent);color:#08222b}.check{accent-color:var(--accent);width:19px;height:19px}.footer{padding:25px;color:var(--muted);text-align:center;font-size:13px}@media(min-width:850px){.sidebarlayout{display:grid;grid-template-columns:280px 1fr;gap:20px}}@media(max-width:480px){.wrap{padding:14px}.fret{grid-template-columns:repeat(6,33px);width:198px}.strings{grid-template-columns:repeat(6,33px);width:198px}}
</style></head><body><header><div style="max-width:1160px;margin:auto"><div class="eyebrow">Dein persönlicher Gitarrenlehrer</div><h1>🎸 Gitarrenakademie</h1><div class="muted">Westerngitarre lernen · Schritt für Schritt · Auf deinem iPad</div></div></header><main class="wrap"><nav class="nav" id="nav"></nav><div id="content"></div></main><footer class="footer">Gitarrenakademie · Persönliche Lernversion · Fortschritt nur auf diesem Gerät gespeichert</footer><script>
const modules=[
['Deine Gitarre kennenlernen',['Aufbau der Westerngitarre','Die sechs Saiten und ihre Namen','Richtig sitzen und Gitarre halten','Plektrum und Anschlag']],
['Erste Töne',['Finger richtig aufsetzen','Die erste Saite spielen','Wechselschlag üben','Saubere Töne kontrollieren']],
['Deine ersten Akkorde',['Em – dein erster Akkord','Am – der zweite Akkord','E-Dur kennenlernen','Zwischen Em und Am wechseln']],
['Weitere Grundakkorde',['D-Dur greifen','A-Dur greifen','C-Dur greifen','G-Dur greifen']],
['Rhythmus und Takt',['Viertelnoten und Puls','Achtelnoten verstehen','Abschläge und Aufschläge','Mit dem Metronom üben']],
['Akkordwechsel',['Em zu G','Am zu C','G zu D','Vier Akkorde verbinden']],
['Schlagmuster',['Einfaches 4/4-Schlagmuster','Ab-Auf-Bewegung','Pausen und Betonungen','Schlagmuster kombinieren']],
['Dein erstes Lied',['Liedaufbau verstehen','Akkordfolge langsam spielen','Im Takt bleiben','Ein einfaches Lied begleiten']],
['Zupfen und Fingerstyle',['Daumen und Finger zuordnen','Einzelne Saiten zupfen','Einfaches Zupfmuster','Zupfen mit Akkordwechsel']],
['Mehr Sicherheit',['F-Dur als leichte Variante','Akkorde ohne Hinsehen','Laut und leise spielen','Schwierige Wechsel trainieren']],
['Musik verstehen',['Tabulatur lesen','Einfache Notenwerte wiederholen','Akkordsymbole verstehen','Eigene Akkordfolge bauen']],
['Dein Abschlussprogramm',['Stimmen ohne Hektik','Rhythmus sicher halten','Zwei Stücke üben','Dein erstes Mini-Konzert']]
];
const details={
'Aufbau der Westerngitarre':['Lerne Kopfplatte, Mechaniken, Sattel, Hals, Bünde, Korpus, Schallloch und Steg kennen.','Zeige nacheinander auf jedes Bauteil deiner eigenen Gitarre und benenne es laut.'],
'Die sechs Saiten und ihre Namen':['Von der dicksten zur dünnsten Saite: E – A – D – G – H – e. Die tiefe E-Saite ist Saite 6, die hohe e-Saite ist Saite 1.','Spiele jede Saite einzeln von 6 nach 1 und sprich ihren Namen.'],
'Richtig sitzen und Gitarre halten':['Setze dich stabil hin, halte Schultern und Handgelenke möglichst entspannt. Der Gitarrenhals sollte gut erreichbar sein.','Halte die Gitarre 2 Minuten, ohne die Schultern hochzuziehen.'],
'Plektrum und Anschlag':['Halte das Plektrum locker zwischen Daumen und Zeigefinger. Bewege es kontrolliert über die Saite.','Spiele 20 ruhige Abschläge auf einer offenen Saite.'],
'Finger richtig aufsetzen':['Setze die Fingerkuppe knapp hinter dem Bundstäbchen auf, ohne das Metall zu berühren. Drücke nur so fest, bis der Ton sauber klingt.','Drücke eine Saite, spiele sie und reduziere den Druck langsam bis kurz vor dem Schnarren.'],
'Em – dein erster Akkord':['Greife A-Saite im 2. Bund mit dem Mittelfinger und D-Saite im 2. Bund mit dem Ringfinger. Schlage alle sechs Saiten an.','Greife Em fünfmal neu. Spiele jedes Mal alle sechs Saiten einzeln und prüfe, ob sie frei klingen.'],
'Am – der zweite Akkord':['Greife D-Saite im 2. Bund mit dem Mittelfinger, G-Saite im 2. Bund mit dem Ringfinger und H-Saite im 1. Bund mit dem Zeigefinger. Tiefe E-Saite nicht anschlagen.','Greife Am fünfmal und kontrolliere jede angeschlagene Saite einzeln.'],
'Zwischen Em und Am wechseln':['Wechsle langsam zwischen Em und Am. Ein sauberer Wechsel ist wichtiger als Geschwindigkeit.','Spiele vier ruhige Abschläge Em, danach vier Abschläge Am. Wiederhole fünfmal.']};
const chords={Em:{frets:[0,2,2,0,0,0],fingers:[0,2,3,0,0,0],desc:'Mittelfinger: A-Saite, 2. Bund. Ringfinger: D-Saite, 2. Bund. Alle Saiten anschlagen.'},Am:{frets:[-1,0,2,2,1,0],fingers:[0,0,2,3,1,0],desc:'Zeigefinger: H-Saite, 1. Bund. Mittelfinger: D-Saite, 2. Bund. Ringfinger: G-Saite, 2. Bund.'},E:{frets:[0,2,2,1,0,0],fingers:[0,2,3,1,0,0],desc:'E-Dur: G-Saite im 1. Bund, A- und D-Saite im 2. Bund.'},D:{frets:[-1,-1,0,2,3,2],fingers:[0,0,0,1,3,2],desc:'D-Dur: nur die vier dünneren Saiten anschlagen.'},A:{frets:[-1,0,2,2,2,0],fingers:[0,0,1,2,3,0],desc:'A-Dur: drei Finger im 2. Bund, tiefe E-Saite auslassen.'},C:{frets:[-1,3,2,0,1,0],fingers:[0,3,2,0,1,0],desc:'C-Dur: A-Saite 3. Bund, D-Saite 2. Bund, H-Saite 1. Bund.'},G:{frets:[3,2,0,0,0,3],fingers:[2,1,0,0,0,3],desc:'G-Dur: tiefe E-Saite 3. Bund, A-Saite 2. Bund, hohe e-Saite 3. Bund.'}};
let page='start',current=0,chosen='Em',bpm=70,metronome=null,audio=null;const key='gitarrenakademie_progress_v1';let completed=JSON.parse(localStorage.getItem(key)||'[]');const total=48;const $=s=>document.querySelector(s);function save(){localStorage.setItem(key,JSON.stringify(completed))}function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function vid(q){return 'https://www.youtube.com/results?search_query='+encodeURIComponent('Gitarre lernen Anfänger deutsch '+q)}function video(q){return `<a class="video" href="${vid(q)}" target="_blank" rel="noopener noreferrer">▶ Passende Videos auf YouTube suchen ↗</a><p class="note">Externe YouTube-Suche; einzelne Videos wurden nicht redaktionell geprüft.</p>`}function count(){return completed.length}function render(){const nav=[['start','🏠 Start'],['lernen','📚 48 Lektionen'],['akkorde','🎸 Akkordtrainer'],['rhythmus','🥁 Rhythmus'],['stimmen','🎵 Stimmen'],['uebungen','✋ Fingertraining']];$('#nav').innerHTML=nav.map(([id,t])=>`<button class="${page===id||page==='lesson'&&id==='lernen'?'active':''}" onclick="go('${id}')">${t}</button>`).join('');let out='';if(page==='start'){out=`<div class="grid"><section class="card"><div class="eyebrow">Dein Lernstand</div><div class="big">${count()} / ${total}</div><p>abgeschlossene Lektionen</p><div class="bar"><span style="width:${count()/total*100}%"></span></div></section><section class="card"><div class="eyebrow">Dein nächster Schritt</div><h2>${escapeHTML(lessonTitle(next()))}</h2><button class="btn primary" onclick="openLesson(${next()})">Lektion starten →</button></section><section class="card"><div class="eyebrow">Für Anfänger</div><h2>10 Minuten reichen zum Start</h2><p>Lieber regelmäßig langsam und sauber üben als einmal pro Woche zu lange.</p></section></div><h2 style="margin-top:26px">Deine Lernbereiche</h2><div class="grid">${[['lernen','📚','Lektionen'],['akkorde','🎸','Akkordtrainer'],['rhythmus','🥁','Metronom'],['stimmen','🎵','Stimmhilfe'],['uebungen','✋','Fingertraining']].map(([id,ico,t])=>`<article class="card click" onclick="go('${id}')"><div class="big">${ico}</div><h3>${t}</h3><p class="muted">Öffnen →</p></article>`).join('')}</div>`}else if(page==='lernen'){out=`<h2>Dein Lernplan: 12 Module · 48 Lektionen</h2><p class="muted">Die Lektionen bauen aufeinander auf. Du kannst trotzdem jederzeit eine Lektion öffnen.</p><div class="grid">${modules.map((m,mi)=>`<section class="card"><span class="pill">Modul ${mi+1}</span><h3>${escapeHTML(m[0])}</h3>${m[1].map((l,li)=>{let i=mi*4+li;return `<div class="lesson"><span>${completed.includes(i)?'✅':'○'} ${escapeHTML(l)}</span><button class="btn" onclick="openLesson(${i})">Öffnen</button></div>`}).join('')}</section>`).join('')}</div>`}else if(page==='lesson'){let title=lessonTitle(current),d=details[title]||generic(current,title),ch=title.match(/^(Em|Am|E-Dur|D-Dur|A-Dur|C-Dur|G-Dur)/),chord=ch?({'E-Dur':'E','D-Dur':'D','A-Dur':'A','C-Dur':'C','G-Dur':'G'}[ch[1]]||ch[1]):null;out=`<button class="btn" onclick="go('lernen')">← Alle Lektionen</button><p class="eyebrow" style="margin-top:22px">Modul ${Math.floor(current/4)+1} · Lektion ${current+1} von 48</p><h2>${escapeHTML(title)}</h2><div class="two"><section class="card"><h3>Das lernst du</h3><p>${escapeHTML(d[0])}</p>${chord?diagram(chord):''}<h3>Jetzt bist du dran</h3><div class="exercise">${escapeHTML(d[1])}</div>${video(title)}</section><section class="card"><h3>Dein Lernziel</h3><p>Übe langsam und wiederhole die Bewegung, bis sie kontrolliert klappt. Es geht nicht um Tempo.</p><label class="row"><input class="check" type="checkbox" ${completed.includes(current)?'checked':''} onchange="toggleLesson(${current},this.checked)"> Lektion abgeschlossen</label><hr style="border:0;border-top:1px solid #2a4350;margin:20px 0"><div class="row"><button class="btn" onclick="openLesson(${Math.max(0,current-1)})">← Zurück</button><button class="btn primary" onclick="openLesson(${Math.min(47,current+1)})">Weiter →</button></div></section></div>`}else if(page==='akkorde'){out=`<h2>Interaktiver Akkordtrainer</h2><p class="muted">Blick auf das Griffbrett von vorne: links die dicke E-Saite, rechts die dünne e-Saite. Zahlen in den Punkten = Finger (1 Zeige-, 2 Mittel-, 3 Ring-, 4 kleiner Finger). X = nicht spielen, O = offen.</p><div class="row" style="margin-bottom:18px">${Object.keys(chords).map(c=>`<button class="btn chordpick ${c===chosen?'active':''}" onclick="pick('${c}')">${c}</button>`).join('')}</div><div class="two"><section class="card">${diagram(chosen)}</section><section class="card"><h3>So übst du</h3><p>1. Finger aufsetzen. 2. Jede Saite einzeln anschlagen. 3. Schnarrende oder gedämpfte Saiten korrigieren. 4. Griff lösen und erneut aufbauen.</p><div class="exercise">Übung: Greife ${chosen} zehnmal neu, ohne Zeitdruck.</div>${video(chosen+' Akkord greifen')}</section></div>`}else if(page==='rhythmus'){out=`<h2>Rhythmustrainer und Metronom</h2><div class="two"><section class="card"><div class="eyebrow">Tempo</div><div class="big"><span id="bpmval">${bpm}</span> BPM</div><div class="row"><button class="btn" onclick="setBpm(-5)">−5</button><button class="btn" onclick="setBpm(5)">+5</button><button class="btn primary" id="metbtn" onclick="toggleMetro()">▶ Start</button></div><p class="note">Töne werden direkt im Browser erzeugt. Für die Ausgabe muss das iPad hörbar gestellt sein.</p></section><section class="card"><h3>Übung im 4/4-Takt</h3><p>Bei jedem Klick einen gleichmäßigen Abschlag spielen. Zähle laut: 1 – 2 – 3 – 4.</p><p>Starte mit 60–70 BPM und erhöhe erst, wenn der Rhythmus stabil bleibt.</p>${video('4 4 takt schlagmuster metronom')}</section></div>`}else if(page==='stimmen'){out=`<h2>Stimmhilfe für Westerngitarre</h2><p>Standardstimmung von der dicksten zur dünnsten Saite: <strong>E – A – D – G – H – e</strong>.</p><div class="card"><p>Tippe auf eine Saite und höre den Referenzton. Vergleiche ihn mit deiner Gitarre. Das ist <strong>kein automatisches Mikrofon-Stimmgerät</strong>.</p><div class="row">${[['E tief',82.41],['A',110],['D',146.83],['G',196],['H',246.94],['e hoch',329.63]].map(([n,f])=>`<button class="btn" onclick="tone(${f})">♪ ${n}</button>`).join('')}</div><p class="note">Bitte Lautstärke moderat einstellen. Für präzises Stimmen ist ein chromatisches Stimmgerät sinnvoll.</p>${video('Westerngitarre richtig stimmen standardstimmung')}</div>`}else if(page==='uebungen'){out=`<h2>Fingertraining für Einsteiger</h2><div class="grid">${[['1. Fingerkuppen treffen','Lege jeden Finger einzeln knapp hinter einen Bund. Kontrolliere, dass benachbarte Saiten frei bleiben.','Finger richtig aufsetzen Gitarre'],['2. Druck dosieren','Spiele einen Ton, reduziere den Druck langsam und erhöhe ihn nur bis der Ton wieder sauber klingt.','Gitarre wie fest Saiten drücken'],['3. Langsamer Fingerwechsel','Setze Zeige- und Mittelfinger abwechselnd auf dieselbe Saite, ohne die Hand zu verkrampfen.','Finger Übungen Anfänger Gitarre'],['4. Em aufbauen und lösen','Greife Em, kontrolliere jede Saite, löse den Griff und wiederhole zehnmal.','Em Akkord lernen Anfänger']].map(([t,d,q])=>`<article class="card"><h3>${t}</h3><p>${d}</p>${video(q)}</article>`).join('')}</div><p class="note">Bei Schmerzen oder Taubheitsgefühlen unterbrechen; keine gewaltsamen Dehnungen.</p>`}$('#content').innerHTML=out}
function lessonTitle(i){return modules[Math.floor(i/4)][1][i%4]}function next(){for(let i=0;i<48;i++)if(!completed.includes(i))return i;return 47}function generic(i,title){let m=Math.floor(i/4);let tips=[['Schau dir die Bewegung genau an und benenne die wichtigsten Teile.','Wiederhole die Grundlagen an deiner eigenen Gitarre und kontrolliere jeden Schritt.'],['Spiele langsam einzelne Töne. Achte auf eine entspannte Haltung und einen klaren Klang.','Spiele die Übung zehnmal langsam. Stoppe, wenn ein Ton schnarrt, und korrigiere die Fingerposition.'],['Setze die Finger möglichst nah hinter den Bund. Prüfe alle angeschlagenen Saiten einzeln.','Greife den Akkord fünfmal neu und prüfe die Töne nacheinander.'],['Übe den Akkord mit korrekten Fingern. Die Fingerkuppen sollen benachbarte Saiten möglichst nicht berühren.','Spiele jeden Ton einzeln und wiederhole den Griff fünfmal.'],['Zähle gleichmäßig laut und bewege die Anschlaghand im Rhythmus.','Spiele vier Takte langsam mit dem Metronom.'],['Bereite den nächsten Griff gedanklich vor und bewege die Finger ruhig.','Wechsle 10-mal zwischen den Akkorden und achte auf saubere Töne.'],['Halte die Anschlaghand locker und die Bewegung gleichmäßig.','Übe das Muster vier Takte lang erst ohne, dann mit Akkorden.'],['Teile die Akkordfolge in kurze Abschnitte auf.','Spiele jeden Abschnitt langsam und verbinde sie erst danach.'],['Zupfe jede Saite kontrolliert, ohne unnötige Spannung in der Hand.','Wiederhole das Zupfmuster fünfmal in gleichmäßigem Tempo.'],['Konzentriere dich auf Präzision und eine entspannte Bewegung.','Übe die schwierige Stelle langsam und steigere das Tempo nur bei sauberem Klang.'],['Lerne die Symbole anhand einer kurzen eigenen Beispielübung.','Schreibe oder spiele ein kurzes Beispiel mit zwei Akkorden.'],['Verbinde Stimmung, Akkorde und Rhythmus zu einer kurzen Spielroutine.','Spiele zwei Minuten am Stück in ruhigem Tempo und notiere, was schon gut funktioniert.']];return [`${title}: ${tips[m][0]}`,tips[m][1]]}function diagram(c){let ch=chords[c],names=['E','A','D','G','H','e'];let dots=ch.frets.map((f,i)=>f>0?`<span class="dot" style="grid-column:${i+1};grid-row:${Math.min(f,5)}">${ch.fingers[i]||'•'}</span>`:'').join('');return `<div class="diagram"><div class="big">${c}</div><div class="strings top">${ch.frets.map(f=>`<span class="${f<0?'off':''}">${f<0?'X':f===0?'O':'●'}</span>`).join('')}</div><div class="fret">${dots}</div><div class="strings">${names.map(n=>`<span>${n}</span>`).join('')}</div><p style="max-width:340px;text-align:center">${ch.desc}</p></div>`}function go(p){stopMetro();page=p;render();window.scrollTo(0,0)}function openLesson(i){current=i;go('lesson')}function pick(c){chosen=c;render()}function toggleLesson(i,on){completed=on?[...new Set([...completed,i])]:completed.filter(x=>x!==i);save();render()}function setBpm(delta){bpm=Math.max(40,Math.min(200,bpm+delta));if(metronome){stopMetro();startMetro()}render()}function getAudio(){audio=audio||new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();return audio}function beep(freq=880,duration=.045){let a=getAudio(),o=a.createOscillator(),g=a.createGain();o.frequency.value=freq;o.type='sine';g.gain.setValueAtTime(.001,a.currentTime);g.gain.exponentialRampToValueAtTime(.18,a.currentTime+.008);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+duration);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+duration+.01)}let beat=0;function startMetro(){beat=0;beep(1100);beat++;metronome=setInterval(()=>{beep(beat%4===0?1100:740);beat++},60000/bpm);let b=$('#metbtn');if(b)b.textContent='■ Stop'}function stopMetro(){if(metronome)clearInterval(metronome);metronome=null;let b=$('#metbtn');if(b)b.textContent='▶ Start'}function toggleMetro(){metronome?stopMetro():startMetro()}function tone(freq){let a=getAudio(),o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.001,a.currentTime);g.gain.linearRampToValueAtTime(.16,a.currentTime+.03);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+2);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+2.02)}render();
</script></body></html>
